# Conda environment for the mason2 simulation pipeline in analyses/ (Snakemake workflows, run scripts
# and Python tools). Exported 2026-10-26 from the working environment with
#   conda env export -n mapping-sims --no-builds
# (machine-specific prefix line removed). Recreate with:  conda env create -f mapping-sims.yml
# The notebooks use a separate R environment: renv.yml. The v1 (NEAT-based) pipeline's 2021
# environment file is snakemake/v1/mapping-sims.yml.
