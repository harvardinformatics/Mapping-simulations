#############################################################################
# s05 — REALISTIC heterogeneous-divergence configuration.
#
# The main config.yaml characterizes the full failure curve (mean D=0.06, sigma up
# to 2, UNCAPPED) -- useful for mapping caller behavior and locating the ~25% local-D
# mapping wall, but its hot regions run to 0.4-0.6 local divergence, which is not
# biological (that is saturation / non-orthologous sequence).
#
# This config is the biologically-defensible scenario:
#   * lower genome-wide mean divergence (0.03),
#   * moderate amplitude (sigma = 1),
#   * a CAP on local divergence (0.20) so hot regions stay in the realistic
#     "fast-evolving" range instead of saturating (validated: per-site local D at
#     read scale has p95 ~0.19, sustained max ~0.25 at cap 0.20), and
#   * HETEROZYGOSITY placed on the SAME field as divergence (het_on_field: true) so
#     diversity co-varies with divergence, as it does in real genomes.
#
# Includes its own homogeneous control (L20000-S0.0 at mean 0.03) for the
# het-vs-homogeneous comparison at this mean. Written to a separate data branch
# (div_target 0.03) and results tag (realistic), so it never collides with the 0.06
# characterization sweep.
#############################################################################

## --- reference -----------------------------------------------------------
ref_file:  /n/holylfs05/LABS/informatics/Lab/projects/gwct/Mapping-simulations/data/reference-genomes/mm39/Mus_musculus.GRCm39.dna.primary_assembly.chromes.fa
ref_index: /n/holylfs05/LABS/informatics/Lab/projects/gwct/Mapping-simulations/data/reference-genomes/mm39/Mus_musculus.GRCm39.dna.primary_assembly.chromes.fa.fai
ref_str:   mm39
region:    "19"

## --- paths ---------------------------------------------------------------
scripts_dir: /n/holylfs05/LABS/informatics/Lab/projects/gwct/Mapping-simulations/analyses/s05-heterogeneous-divergence/scripts
lib_dir:     /n/holylfs05/LABS/informatics/Lab/projects/gwct/Mapping-simulations/analyses/lib
data_dir:    /n/holylfs05/LABS/informatics/Lab/projects/gwct/Mapping-simulations/data/s05-heterogeneous-divergence
results_dir: /n/holylfs05/LABS/informatics/Lab/projects/gwct/Mapping-simulations/analyses/s05-heterogeneous-divergence/results

## --- simulation ----------------------------------------------------------
covs:  ["30"]
div_target: "0.03"           # lower, more realistic genome-wide mean divergence
het:   "0.005"
indel_divergence:  0.0       # SNP-only
indel_heterozygosity: 0.0
seeds: ["42"]
read_length: 150
fragment_mean: 300

## --- divergence field (realistic: capped, het on field) ------------------
field_configs:
  - "L20000-S0.0"            # homogeneous control at mean 0.03
  - "L20000-S1.0-C0.20"      # realistic: sigma=1, corr 20kb, local-D capped at 0.20
field_seed: 42
het_on_field: true           # heterozygosity co-varies with divergence (same field)

## --- local-divergence annotation -----------------------------------------
local_div_windows: "150,500"

## --- mapping / iteration -------------------------------------------------
n_iterations: 3

## --- variant callers -----------------------------------------------------
callers: ["gatk", "bcftools", "freebayes"]
min_mapping_quality: 20
gatk_scatter: 8

## --- labeling ------------------------------------------------------------
run_tag: "realistic"
