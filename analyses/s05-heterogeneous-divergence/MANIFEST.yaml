    script: analyses/s05-heterogeneous-divergence/workflow-indels.smk
    command: >-
      cd analyses/s05-heterogeneous-divergence && sbatch run_sweep_hetindel.sh
      (snakemake -s workflow-indels.smk rules combine_recovery / combine_het, which run
