# MANIFEST.yaml -- s05-heterogeneous-divergence: this section's top-level data dictionary and
# provenance record. Lists every data file, figure and notebook in
# analyses/s05-heterogeneous-divergence/ with the script and exact command that produce it, its
# inputs, and what reads it. Each table's columns are defined in its own <table>.dict.txt. Schema and
# checks: analyses/lib/check_manifest.py; run
#   conda run -n mapping-sims python analyses/lib/check_manifest.py s05-heterogeneous-divergence
#
# Five simulation runs feed this section (all chr19, 30X, het 0.005, seed 42, field seed 42):
#   A. characterization sweep, mean D 0.06, five field configs L{corr_len}-S{sigma}
#      (L20000-S0.0 = homogeneous control, L2000-S1.0, L20000-S1.0, L200000-S1.0, L20000-S2.0);
#      SNP-only.  workflow.smk + config/config.yaml, launcher run_sweep.sh.
#   B. realistic, mean D 0.03: L20000-S0.0 control + L20000-S1.0-C0.20 (local-D cap 0.20, het on
#      the same field); SNP-only.  workflow.smk + config/config-realistic.yaml, run_realistic.sh.
#   C. realistic mean sweep, L20000-S1.0-C0.20 at mean D 0.01/0.02/0.03/0.04/0.06; SNP-only
#      (0.03 reuses run B).  workflow.smk + config/config-realistic-meansweep.yaml,
#      run_realistic_meansweep.sh (one snakemake pass per mean, then one combine).
#   D. het-indels isolation run, mean D 0.06, sigma 1, corr 20 kb, indels on the field, het
#      uniform, uncapped.  workflow-indels.smk + config/config-hetindel.yaml, run_sweep_hetindel.sh.
#   E. realistic mean sweep WITH indels (cap 0.20, het + indels on the field), mean D 0.01-0.06.
#      workflow-indels.smk + config/config-realistic-meansweep-indels.yaml,
#      run_realistic_meansweep_indels.sh.
# Every sbatch launcher was submitted from INSIDE this directory (relative #SBATCH --output).
# The per-site tables (local recall, landscape, mapping-vs-calling, het-indel local recovery) came
# from AD HOC commands typed in an earlier session (recovered from the session log; times UTC).
# Every table below was re-made on 2026-10-26 from the existing inputs with the CURRENT code into
# .llm-tmp/s05/ and compared with cmp: all are byte-identical (the post-run edits to the producing
# scripts touch only their argument parsing / dictionary writing). Placeholders in `inputs:`:
# {caller} = gatk | bcftools | freebayes, {K} = iteration 1 | 2 | 3.
section: s05-heterogeneous-divergence
question: With the genome-wide mean divergence fixed, how does spatially heterogeneous (autocorrelated, patchy) divergence change SNP and indel recovery, and is recall predicted by LOCAL divergence?

upstream:
  - path: data/s05-heterogeneous-divergence/
    from: "s05 SNP-only workflow (workflow.smk) runs A, B and C above: ref-regions/mm39-19.fa,
      sim/30X/19/{D}/0.005/{field}/42/ (truth VCFs, normalized truth, per-site local divergence
      mm39-truth-locald.tsv, reads) and iter/{caller}/30X/19/{D}/0.005/{field}/42/iter{K}/ (BAMs,
      calls, consensus, recovered VCFs, per-condition mm39-vcf-summary.csv). Also varfate/{field}/
      truth.oa.bam (mason -oa truth BAMs) from cd analyses/s05-heterogeneous-divergence && sbatch
      run_vrf_truthbam.sh (L20000-S1.0) and sbatch run_vrf_truthbam_capped.sh (L20000-S1.0-C0.20).
      Note: the locald TSVs of runs A and B (made 2026-08-08/09) lack the TYPE column that
      annotate_local_divergence.py gained on 2026-08-10 (runs C-E have it); the s05 scripts read
      columns by header name, so both layouts work"
  - path: data/s05-heterogeneous-divergence/indels/
    from: "run D: cd analyses/s05-heterogeneous-divergence && sbatch run_sweep_hetindel.sh
      (workflow-indels.smk, config/config-hetindel.yaml; preceded by the bcftools-only validation
      chain sbatch run_validate_hetindel.sh)"
  - path: data/s05-heterogeneous-divergence/realistic-indels/
    from: "run E: cd analyses/s05-heterogeneous-divergence && sbatch run_realistic_meansweep_indels.sh
      (workflow-indels.smk, config/config-realistic-meansweep-indels.yaml)"
  - path: analyses/s01-baseline-iterative/results/s01-base-iterative-summary.csv
    from: "s01 workflow (see analyses/s01-baseline-iterative/MANIFEST.yaml); the homogeneous SNP
      baseline the s05 notebook compares the realistic mean sweep against"
  - path: analyses/s02-indels/results/s02-indels-recovery-summary.csv
    from: "s02 workflow (see analyses/s02-indels/MANIFEST.yaml); the homogeneous indel baseline the
      s05 notebook compares the het-indels run against"

notebooks:
  # The html was rendered 2026-08-11 12:33 UTC; the rmd has since gained the provenance chunk
  # (uncommitted), so the html predates the current rmd until it is re-rendered.
  - path: analyses/s05-heterogeneous-divergence/s05-results.rmd
    html: analyses/s05-heterogeneous-divergence/s05-results.html
    render: >-
      conda run -n renv Rscript -e
      'rmarkdown::render("analyses/s05-heterogeneous-divergence/s05-results.rmd",
      knit_root_dir = getwd(), quiet = TRUE)'

outputs:
  # --- workflow summaries (compare_vcfs.py per condition, concatenated by combine_summaries.py) ---
  - path: analyses/s05-heterogeneous-divergence/results/s05-hetdiv-iterative-summary.csv
    what: "run A (mean D 0.06): SNP recovery (recovered set vs truth, compare_vcfs.py) per field
      config x caller x iteration; 45 rows, last column = field tag"
    script: analyses/s05-heterogeneous-divergence/workflow.smk
    command: >-
      cd analyses/s05-heterogeneous-divergence && sbatch run_sweep.sh
      (snakemake -s workflow.smk rule combine_s05, which runs analyses/lib/combine_summaries.py
      --kind vcf; config/config.yaml, run_tag hetdiv)
    inputs:
      - data/s05-heterogeneous-divergence/iter/{caller}/30X/19/0.06/0.005/{field}/42/iter{K}/mm39-vcf-summary.csv
      - "({field} = L20000-S0.0 L2000-S1.0 L20000-S1.0 L200000-S1.0 L20000-S2.0)"
    used_by: [analyses/s05-heterogeneous-divergence/s05-results.rmd]
    git: tracked
    note: "orchestrator submitted 2026-08-08 02:15 UTC (job 37722476; a 01:57 UTC submission was
      cancelled), combine ran 05:46 UTC. Re-combining the per-condition summaries with the current
      combine_summaries.py reproduces it byte for byte (checked 2026-10-26)"

  - path: analyses/s05-heterogeneous-divergence/results/s05-realistic-iterative-summary.csv
    what: "run B (mean D 0.03): SNP recovery per field config (L20000-S0.0 control,
      L20000-S1.0-C0.20 realistic) x caller x iteration; 18 rows, last column = field tag"
    script: analyses/s05-heterogeneous-divergence/workflow.smk
    command: >-
      cd analyses/s05-heterogeneous-divergence && sbatch run_realistic.sh
      (snakemake -s workflow.smk rule combine_s05, which runs analyses/lib/combine_summaries.py
      --kind vcf; config/config-realistic.yaml, run_tag realistic)
    inputs:
      - data/s05-heterogeneous-divergence/iter/{caller}/30X/19/0.03/0.005/{field}/42/iter{K}/mm39-vcf-summary.csv
      - "({field} = L20000-S0.0 L20000-S1.0-C0.20)"
    used_by: [analyses/s05-heterogeneous-divergence/s05-results.rmd]
    git: tracked
    note: "orchestrator submitted 2026-08-09 19:39 UTC (job 37938668), combine ran 23:13 UTC.
      Re-combining reproduces it byte for byte (checked 2026-10-26)"

  - path: analyses/s05-heterogeneous-divergence/results/s05-realistic-meansweep-iterative-summary.csv
    what: "run C: SNP recovery of the realistic field L20000-S1.0-C0.20 at mean D 0.01-0.06 x caller
      x iteration; 45 rows, last column = field tag"
    script: analyses/s05-heterogeneous-divergence/run_realistic_meansweep.sh
    command: >-
      cd analyses/s05-heterogeneous-divergence && sbatch run_realistic_meansweep.sh
      (its final step: python analyses/lib/combine_summaries.py --inputs $(find
      data/s05-heterogeneous-divergence/iter -path "*L20000-S1.0-C0.20*/iter*/mm39-vcf-summary.csv" | sort)
