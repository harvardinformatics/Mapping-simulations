  - path: analyses/s05-heterogeneous-divergence/results/s05-{table}.csv
    values: {table: ["landscape", "localdist"]}
    what: "run A landscape descriptors: landscape = local divergence along chr19 in 50 kb bins per
      field config; localdist = histogram of per-site local divergence per config x window"
    script: analyses/s05-heterogeneous-divergence/scripts/local_landscape.py
    command: >-
      conda run -n mapping-sims python analyses/s05-heterogeneous-divergence/scripts/local_landscape.py
