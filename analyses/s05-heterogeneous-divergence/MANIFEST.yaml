      --kind vcf)
    inputs:
      - data/s05-heterogeneous-divergence/iter/{caller}/30X/19/{D}/0.005/L20000-S1.0-C0.20/42/iter{K}/mm39-vcf-summary.csv
      - "({D} = 0.01 0.02 0.03 0.04 0.06; 0.03 is run B's data)"
    used_by:
      - analyses/s05-heterogeneous-divergence/s05-results.rmd
      - analyses/synthesis/synthesis.rmd
      - analyses/synthesis/brief.rmd
    git: tracked
    note: "orchestrator submitted 2026-08-10 15:03 UTC (job 38065683; the 15:01 UTC job 38065481 died on a
      float div_target, fixed in workflow.smk), final combine 2026-08-11 03:09 UTC. Each per-mean
