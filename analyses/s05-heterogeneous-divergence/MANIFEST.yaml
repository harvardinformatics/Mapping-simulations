      --out analyses/s05-heterogeneous-divergence/results/s05-local-recall.csv
    inputs:
      - data/s05-heterogeneous-divergence/sim/30X/19/0.06/0.005/{field}/42/mm39-truth-locald.tsv
      - data/s05-heterogeneous-divergence/iter/{caller}/30X/19/0.06/0.005/{field}/42/iter{K}/mm39_recovered.vcf.gz
    used_by: [analyses/s05-heterogeneous-divergence/s05-results.rmd]
    git: tracked
    note: "ad hoc command (2026-08-09 01:57 UTC), not in a run script. local_recall.py was edited
      afterwards (2026-08-10: parse_field accepts -C cap tags; 2026-10-26: provenance block in the
