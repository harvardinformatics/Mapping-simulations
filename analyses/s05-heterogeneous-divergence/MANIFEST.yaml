  # --- mapping-vs-calling decomposition --------------------------------------------------------------
  - path: analyses/s05-heterogeneous-divergence/results/vrf-pileup/vrf-pileup-{caller}.csv
    values: {caller: ["gatk", "bcftools", "freebayes"]}
    what: "per-divergent-SNP read-fate ledger + caller pileup at the SNP (variant_read_fate.py
