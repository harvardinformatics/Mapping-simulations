# MANIFEST.yaml -- s02-indels: this section's top-level data dictionary and provenance record.
# Lists every data file, figure and notebook in analyses/s02-indels/ with the script and exact
# command that produce it, its inputs, and what reads it. Each table's columns are defined in its
# own <table>.dict.txt. Schema and checks: analyses/lib/check_manifest.py; run
#   conda run -n mapping-sims python analyses/lib/check_manifest.py s02-indels
# Commands that start with `cd analyses/s02-indels && sbatch ...` are run from the project root;
# the sbatch scripts are submitted from inside the section directory (their --output is relative).
section: s02-indels
question: >-
  With indels added to the simulated divergence, does iterative (pseudo-it) mapping with consensus
  liftover still recover reference-biased SNPs and indels, and how does that depend on the caller?

upstream:
  - path: data/s02-indels/
    from: "s02 workflow: cd analyses/s02-indels && sbatch run_sweep.sh (workflow.smk,
      config/config.yaml) -- region reference, mason truth VCFs / -oa truth BAMs, reads, per-iteration
      BAMs, calls, accumulated recovered VCFs, consensus FASTAs, ref2cons/cons2ref chains and the
      per-condition -vcf-summary.csv files; then cd analyses/s02-indels && sbatch
      run_read_classification.sh (read_classification.smk) for the per-condition
      -readclass-bam-summary.csv files (git-ignored)"
  - path: analyses/s01-baseline-iterative/results/
    from: "s01 section (see analyses/s01-baseline-iterative/MANIFEST.yaml): s02-results.rmd reads the
      SNP-only baseline s01-base-iterative-summary.csv and vrf-agg/*-hcomp.csv for comparison"

notebooks:
  - path: analyses/s02-indels/s02-results.rmd
    html: analyses/s02-indels/s02-results.html
    render: >-
      conda run -n renv Rscript -e 'rmarkdown::render("analyses/s02-indels/s02-results.rmd",
      knit_root_dir = getwd(), quiet = TRUE)'
    note: "the html was rendered 2026-08-07 11:46; the rmd has since gained the provenance chunk
      (uncommitted working-tree edit), so the html predates that chunk until it is re-rendered"

outputs:
  # --- workflow summary tables (snakemake; combine_summaries.py concatenates per-condition rows) ---
  - path: analyses/s02-indels/results/s02-indels-recovery-summary.csv
    what: "recovery of hom-divergent SNPs and indels: accumulated recovered set vs truth
      (compare_vcfs.py), one row per caller x divergence x iteration"
    script: analyses/lib/combine_summaries.py
    command: >-
      cd analyses/s02-indels && sbatch run_sweep.sh   (snakemake rule combine_recovery in
      workflow.smk, config/config.yaml; file name = results_dir + "s02-" + run_tag +
      "-recovery-summary.csv", run_tag "indels")
    inputs:
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{k}/mm39-recovery-vcf-summary.csv
    used_by:
      - analyses/s02-indels/s02-results.rmd
      - analyses/s05-heterogeneous-divergence/s05-results.rmd
      - analyses/synthesis/synthesis.rmd
      - analyses/synthesis/brief.rmd
    git: tracked
    note: "last regenerated 2026-08-07 by sbatch run_sweep.sh (02:15 UTC), after D = 0.001 / 0.005
      were added to config; header matches the current compare_vcfs.py BASE_COLUMNS"

  - path: analyses/s02-indels/results/s02-indels-het-summary.csv
    what: "heterozygous SNP/indel recovery: the lifted raw caller VCF vs truth (compare_vcfs.py),
      one row per caller x divergence x iteration (D = 0 kept as the germline baseline)"
    script: analyses/lib/combine_summaries.py
    command: >-
      cd analyses/s02-indels && sbatch run_sweep.sh   (snakemake rule combine_het in workflow.smk,
      config/config.yaml; file name = results_dir + "s02-" + run_tag + "-het-summary.csv")
    inputs:
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{k}/mm39-het-vcf-summary.csv
    used_by: [analyses/s02-indels/s02-results.rmd]
    git: tracked
    note: "last regenerated 2026-08-07 by the same run_sweep.sh run as the recovery summary"

  - path: analyses/s02-indels/results/s02-indels-readclass-by-iter.csv
    what: "read placement (exact / shifted / clipped / span_off / mismapped ...) of each iteration's
      mapped BAM vs the mason -oa truth, iter>1 point-lifted to reference (compare_bams.py)"
    script: analyses/lib/combine_summaries.py
    command: >-
      cd analyses/s02-indels && sbatch run_read_classification.sh --forcerun classify_reads
      (snakemake rule combine_readclass in read_classification.smk, config/config.yaml; run
      after run_sweep.sh)
    inputs:
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{k}/mm39-readclass-bam-summary.csv
    used_by: [analyses/s02-indels/s02-results.rmd]
    git: tracked
    note: >-
      regenerated 2026-10-27 at commit efa152b (job 55770604): each read's true span comes from
      its oP tag and its placement start from the best alignment of its leftmost 30 bases on its
      haplotype (analyses/lib/truth_haplotypes.py). --forcerun because the fix is in an imported
      module, which snakemake's code-change trigger cannot see. Dictionaries rewritten
      2026-10-28 at 8111fc4 for a wording fix; the combined table was re-made then by its
      recorded combine_summaries.py command (byte-identical). Change vs the previous table
      (mean): most of the old shifted class was the truth BAM's alignment-start error -- at D =
      0.10 iteration 3 shifted fell by ~21.5 pp and exact rose by ~21.5-22 pp; span_off fell by
      <= 0.45 pp; clipped, mismapped and unmapped unchanged

  - path: analyses/s02-indels/results/s02-indels-callvcf-composition.csv
    what: "record composition (SNP / indel / '*' allele / split-multiallelic) of each caller's
      normalized call VCF at D = 0.10, per iteration"
    script: analyses/s02-indels/scripts/callvcf_composition.sh
    command: bash analyses/s02-indels/scripts/callvcf_composition.sh
    inputs:
      - data/s02-indels/iter/{caller}/30X/19/0.10/0.005/42/iter{k}/mm39_calls.norm.vcf.gz
    used_by: [analyses/s02-indels/s02-results.rmd]
    git: tracked
    note: "first made 2026-08-02 (17:55 UTC) by an ad hoc loop, not in a run script; the script
      (2026-10-26) codifies that loop and reproduces the table byte for byte (verified 2026-10-26)"

  # --- per-SNP variant read fate (SNPs in the indel context) ---------------------------------------
  - path: analyses/s02-indels/results/vrf-agg/vrf-agg-{caller}-{D}-gtraj.csv
    values: {caller: [gatk, bcftools, freebayes], D: ["0.005", "0.02", "0.04", "0.06", "0.08", "0.10"]}
    what: "full-chromosome count of hom-div SNPs per (call status, f_alt bin) trajectory across
      iterations 1-3 (figure G input); iter>1 lifted into consensus coords via ref2cons.chain"
    script: analyses/s02-indels/run_vrf_aggregate.sh
    command: >-
      bash analyses/s02-indels/submit_vrf_aggregate.sh (submits: cd analyses/s02-indels &&
      sbatch run_vrf_aggregate.sh {caller} {D})
    inputs:
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.oa.bam
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.norm.vcf.gz
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{1,2,3}/mm39_mapped.bam
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{1,2,3}/mm39_recovered.acc.vcf.gz
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{1,2}/ref2cons.chain
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.vcf.gz
      - data/s02-indels/ref-regions/mm39-19.fa
    used_by:
      - analyses/s02-indels/s02-results.rmd
      - analyses/synthesis/brief.rmd
      - analyses/s02-indels/scripts/vrf_agg_G.R
    git: tracked
    note: >-
      regenerated 2026-10-27 at commit efa152b (Slurm jobs 55770711-55770826; dictionaries
      rewritten 2026-10-28 at 8111fc4 for a wording fix) after the true-span fix (true read
      spans from mason's oP tag, placement start from each read's leftmost-bases alignment,
      analyses/lib/truth_haplotypes.py; mason's POS is off for ~32% of s02 reads). Against the
      previous tables: total and per-iteration called SNP counts identical; the trajectory
      distribution moves by up to 1.5% (total-variation distance, D = 0.10), f_alt-bin shares by
      up to 1.1 percentage points

  - path: analyses/s02-indels/results/vrf-agg/vrf-agg-{caller}-{D}-hcomp.csv
    values: {caller: [gatk, bcftools, freebayes], D: ["0.005", "0.02", "0.04", "0.06", "0.08", "0.10"]}
    what: "full-chromosome read-fate composition at each hom-div SNP position p by call status and
      iteration (figure H input: alt at p, clipped, absent ...)"
    script: analyses/s02-indels/run_vrf_aggregate.sh
    command: >-
      bash analyses/s02-indels/submit_vrf_aggregate.sh (submits: cd analyses/s02-indels &&
      sbatch run_vrf_aggregate.sh {caller} {D})
    inputs:
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.oa.bam
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.norm.vcf.gz
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{1,2,3}/mm39_mapped.bam
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{1,2,3}/mm39_recovered.acc.vcf.gz
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{1,2}/ref2cons.chain
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.vcf.gz
      - data/s02-indels/ref-regions/mm39-19.fa
    used_by: [analyses/s02-indels/s02-results.rmd]
    git: tracked
    note: >-
      regenerated 2026-10-27 at commit efa152b (Slurm jobs 55770711-55770826; dictionaries
      rewritten 2026-10-28 at 8111fc4 for a wording fix) after the true-span fix (true read
      spans from mason's oP tag, placement start from each read's leftmost-bases alignment,
      analyses/lib/truth_haplotypes.py). Against the previous tables: at-p class shares move by
      up to 2.5 percentage points (largest: gatk D = 0.10 iteration 3 called SNPs, alt at p
      95.6% -> 98.1%, clipped 2.0% -> 0.8%); covering reads -2.1% to +0.4%

  - path: analyses/s02-indels/results/vrf-pileup/vrf-pileup-{caller}-{D}.csv
    values: {caller: [gatk, bcftools, freebayes], D: ["0.06", "0.08", "0.10"]}
    what: "per-SNP read-fate ledger plus the position-centric pileup at p (depth, ref/alt/other,
      MAPQ, mismapped-in reads) for a ~30k systematic sample of hom-div SNPs, iterations 1-3"
    script: analyses/s02-indels/run_vrf_pileup.sh
    command: >-
      bash analyses/s02-indels/submit_vrf_pileup.sh
      (submits: cd analyses/s02-indels && sbatch run_vrf_pileup.sh {caller} {D})
    inputs:
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.oa.bam
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.norm.vcf.gz
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{1,2,3}/mm39_mapped.bam
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{1,2,3}/mm39_recovered.acc.vcf.gz
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{1,2}/ref2cons.chain
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.vcf.gz
      - data/s02-indels/ref-regions/mm39-19.fa
    used_by:
      - analyses/s02-indels/s02-results.rmd
      - analyses/synthesis/synthesis.rmd
      - analyses/synthesis/brief.rmd
      - analyses/s02-indels/run_neighborhood.sh
      - analyses/s02-indels/scripts/aggregate_calling_metrics.R
    git: ignored
    note: >-
      regenerated 2026-10-27 at commit efa152b (Slurm jobs 55770853-55773446; dictionaries
      rewritten 2026-10-28 at 8111fc4 for a wording fix) after the true-span fix (true read
      spans from mason's oP tag, placement start from each read's leftmost-bases alignment,
      analyses/lib/truth_haplotypes.py). The previous tables were git-ignored and are
      overwritten; the tables derived from them (neighborhood/, calling-metrics-by-{fate}.csv)
      came out byte-identical. The notebooks and both scripts read all nine

  - path: analyses/s02-indels/results/neighborhood/neighborhood-per-snp.csv
    what: "per sampled SNP x iteration: count of still-unrecovered truth SNPs / indels within
      +/-200 bp (the assemblable-neighbourhood load)"
    script: analyses/lib/neighborhood_assembly.py
    command: bash analyses/s02-indels/run_neighborhood.sh
    inputs:
      - analyses/s02-indels/results/vrf-pileup/vrf-pileup-{caller}-{D}.csv
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.norm.vcf.gz
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{k}/mm39_recovered.acc.vcf.gz
    used_by:
      - analyses/s02-indels/s02-results.rmd
      - analyses/synthesis/synthesis.rmd
      - analyses/synthesis/brief.rmd
    git: ignored
    note: "regenerated 2026-10-28 (commit 8111fc4) from the regenerated vrf-pileup tables. The
      script writes the dictionary's provenance and field sections; its WHAT THIS IS / KEY
      READING sections were hand-written earlier and re-appended from git after this run (a
      re-run of the script drops them)"

  - path: analyses/s02-indels/results/neighborhood/neighborhood-summary.csv
    what: "per caller x divergence x iteration-transition fate (flip / stayed called / stayed
      not-called): mean truth neighbours and mean unrecovered neighbours before / after, +/-200 bp"
    script: analyses/lib/neighborhood_assembly.py
    command: bash analyses/s02-indels/run_neighborhood.sh
    inputs:
      - analyses/s02-indels/results/vrf-pileup/vrf-pileup-{caller}-{D}.csv
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.norm.vcf.gz
      - data/s02-indels/iter/{caller}/30X/19/{D}/0.005/42/iter{k}/mm39_recovered.acc.vcf.gz
    used_by: [analyses/s02-indels/s02-results.rmd]
    git: tracked
    note: "regenerated 2026-10-28 (commit 8111fc4) from the regenerated vrf-pileup tables;
      byte-identical to the previous table"

  # --- static calling-side covariates ----------------------------------------------------------------
  - path: analyses/s02-indels/results/calling-metrics/calling-metrics-{D}.csv
    values: {D: ["0.06", "0.08", "0.10"]}
    what: "per divergent truth SNP: homopolymer fraction, indel / SNP / het density (+/-100 bp) and
      distance to the nearest indel -- static local context"
    script: analyses/lib/calling_metrics.py
    command: cd analyses/s02-indels && sbatch run_calling_metrics.sh
    inputs:
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.vcf.gz
      - data/s02-indels/ref-regions/mm39-19.fa
    used_by: [analyses/synthesis/brief.rmd]
    git: ignored
    note: "made 2026-08-13 (16:11 UTC) by an ad hoc loop equivalent to run_calling_metrics.sh
      (the script was written ~2 h later): for d in 0.06 0.08 0.10; conda run -n mapping-sims python
      analyses/lib/calling_metrics.py --truth-vcf data/s02-indels/sim/30X/19/$d/0.005/42/mm39-truth.vcf.gz
      --reference data/s02-indels/ref-regions/mm39-19.fa --divergence $d --window 100
      --out analyses/s02-indels/results/calling-metrics/calling-metrics-$d.csv (default --hp-min 5).
      The current calling_metrics.py reproduces calling-metrics-0.06.csv byte for byte (verified).
      brief.rmd reads only the D = 0.10 file; all three are concatenated into calling-metrics.csv"

  - path: analyses/s02-indels/results/calling-metrics/calling-metrics.csv
    what: "the three calling-metrics-{D}.csv tables concatenated under one header (0.06, 0.08, 0.10)"
    script: analyses/s02-indels/run_calling_metrics.sh
    command: cd analyses/s02-indels && sbatch run_calling_metrics.sh
    inputs:
      - analyses/s02-indels/results/calling-metrics/calling-metrics-{D}.csv
    used_by: [analyses/s02-indels/scripts/aggregate_calling_metrics.R]
    git: ignored
    note: "concatenated 2026-08-13 (16:11 UTC) by the same ad hoc loop as the per-divergence tables
      (head -1 of the 0.06 table, then tail -n +2 of 0.06, 0.08, 0.10 -- what the run script does)"

  - path: analyses/s02-indels/results/calling-metrics/calling-metrics-by-{fate}.csv
    values: {fate: [fate, iterfate]}
    what: "mean + SE of each static covariate per caller x divergence x fate: single-shot iter1
      fate (by-fate) or the iter1->iter2 transition fate (by-iterfate)"
    script: analyses/s02-indels/scripts/aggregate_calling_metrics.R
    command: conda run -n renv Rscript analyses/s02-indels/scripts/aggregate_calling_metrics.R
    inputs:
      - analyses/s02-indels/results/calling-metrics/calling-metrics.csv
      - analyses/s02-indels/results/vrf-pileup/vrf-pileup-{caller}-{D}.csv
    used_by: [analyses/synthesis/synthesis.rmd]
    git: tracked
    note: >-
      re-run 2026-10-28 on the regenerated vrf-pileup tables: both tables byte-identical to the
      previous ones (their dictionaries were not rewritten)

  # --- figure G (call-state x f_alt flow), from the vrf-agg -gtraj tables ---------------------------
  - path: analyses/s02-indels/results/vrf-viz-G/G_grid.png
    what: "figure G grid: callers (rows) x D = 0.02-0.10 (columns), one shared f_alt legend"
    script: analyses/s02-indels/scripts/vrf_agg_G.R
    command: conda run -n renv Rscript analyses/s02-indels/scripts/vrf_agg_G.R
    inputs:
      - analyses/s02-indels/results/vrf-agg/vrf-agg-{caller}-{D}-gtraj.csv
    used_by: [analyses/synthesis/synthesis.rmd]
    git: tracked
    note: >-
      redrawn 2026-10-28 by analyses/lib/vrf_G_figs.R via this driver (run from the project
      root) from the regenerated gtraj tables

  - path: analyses/s02-indels/results/vrf-viz-G/G_{caller}_D{d}.png
    values: {caller: [gatk, bcftools, freebayes], d: ["0.02", "0.04", "0.06", "0.08", "0.1"]}
    what: "standalone figure G panel for one caller x divergence (file label uses R's format(), so 0.1)"
    script: analyses/s02-indels/scripts/vrf_agg_G.R
    command: conda run -n renv Rscript analyses/s02-indels/scripts/vrf_agg_G.R
    inputs:
      - analyses/s02-indels/results/vrf-agg/vrf-agg-{caller}-{D}-gtraj.csv
    used_by: []
    git: tracked
    status: unused
    note: "written alongside G_grid.png by the same 2026-10-28 run; no notebook embeds them
      (s02-results.rmd builds G from the gtraj tables, synthesis.rmd embeds only G_grid.png)"

  # --- truth-site check (phantom sites) ---------------------------------------------------------
  - path: analyses/s02-indels/results/effective-truth/eff-{D}-phantom.tsv
    values: {D: ["0.00", "0.001", "0.005", "0.02", "0.04", "0.06", "0.08", "0.10"]}
    what: "truth SNPs not present in the simulated reads (phantoms), one row each; header only when
      there are none"
    script: analyses/lib/effective_truth.py
    command: cd analyses/s02-indels && sbatch run_effective_truth.sh
    inputs:
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.oa.bam
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.vcf.gz
      - data/s02-indels/ref-regions/mm39-19.fa
    used_by: []
    git: tracked
    note: "corrected method (2026-10-26): bases read at each read's haplotype position (oP) on haplotypes
      rebuilt from the mason-format truth VCF; the earlier version read them through mason's -oa CIGAR
      and wrongly flagged tens of thousands of SNPs (its counts are kept in the summary's n_cigar_flag_*)"

  - path: analyses/s02-indels/results/effective-truth/eff-{D}-summary.csv
    values: {D: ["0.00", "0.001", "0.005", "0.02", "0.04", "0.06", "0.08", "0.10"]}
    what: "one row per divergence: phantom counts and rates, alt-fraction spread, read consistency with
      the rebuilt haplotypes, and the old CIGAR method's flag counts"
    script: analyses/lib/effective_truth.py
    command: cd analyses/s02-indels && sbatch run_effective_truth.sh
    inputs:
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.oa.bam
      - data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.vcf.gz
      - data/s02-indels/ref-regions/mm39-19.fa
    used_by: [analyses/s02-indels/run_effective_truth.sh]
    git: tracked

  - path: analyses/s02-indels/results/effective-truth/phantom-by-divergence.csv
    what: "the eff-<D>-summary.csv rows of every divergence under one header"
    script: analyses/s02-indels/run_effective_truth.sh
    command: cd analyses/s02-indels && sbatch run_effective_truth.sh
    inputs:
      - analyses/s02-indels/results/effective-truth/eff-{D}-summary.csv
    used_by: [analyses/s02-indels/s02-results.rmd]
    git: tracked

  - path: analyses/s02-indels/results/retired/phantom-adjacency.csv
    what: "distance from the OLD scan's phantom-flagged vs other hom-div SNPs to the nearest other truth
      variant (retired with analyses/lib/retired/phantom_adjacency.py)"
    script: analyses/lib/retired/phantom_adjacency.py
    command: >-
      python analyses/lib/phantom_adjacency.py
      --truth "data/s02-indels/sim/30X/19/{D}/0.005/42/mm39-truth.norm.vcf.gz"
      --phantom "analyses/s02-indels/results/effective-truth/eff-{D}-phantom.tsv"
      --out analyses/s02-indels/results/effective-truth/phantom-adjacency.csv
      --divs 0.04,0.06,0.08,0.10
      (2026-08-06 17:50 UTC, via conda run -n mapping-sims; the script and the table have since moved to retired/)
    used_by: []
    git: tracked
    status: artifact
    note: "built on the old scan's phantom flags, which were a CIGAR artifact; its 'phantoms sit ~1 bp
      from a neighbour' result describes where that artifact occurs (dense SNP clusters). Kept for the
      record (moved here 2026-10-26)"

ignore:
  - glob: analyses/s02-indels/results/s02-indels-callvcf-composition.csv.status
    reason: "job-status marker written by the 2026-08-02 ad hoc callvcf-composition loop; not data"
