# MANIFEST.yaml -- s08-mappability: this section's top-level data dictionary and provenance record.
# Lists every data file, figure and notebook in analyses/s08-mappability/ with the script and exact
# command that produce it, its inputs, and what reads it. Each table's columns are defined in its
# own <table>.dict.txt. Schema and checks: analyses/lib/check_manifest.py; run
#   conda run -n mapping-sims python analyses/lib/check_manifest.py s08-mappability
#
# No run script: the GenMap track and the table came from AD HOC commands typed in an earlier
# session (recovered from the session log; times UTC). No new simulation, mapping or calling: the
# s01 (SNP-only) truth and recovered sets are re-scored by reference mappability.
# Placeholders in `inputs:` below: {caller} = gatk | bcftools | freebayes, {D} = 0.02 | 0.06 | 0.10,
# {K} = iteration 1 | 3.
section: s08-mappability
question: How much does low reference mappability (repeats) reduce SNP recovery, independent of divergence, and does iterative mapping relieve it?

upstream:
  - path: data/s01-baseline-iterative/
    from: "s01 workflow (cd analyses/s01-baseline-iterative && sbatch run_sweep.sh; config/config.yaml):
      the normalized truth VCFs and the iter1 / iter3 recovered VCFs that mappability_recovery.py
      re-scores"
  - path: data/s08-mappability/genmap/
    from: "GenMap 1.3.0 (mapping-sims env), ad hoc commands 2026-08-12 02:56 UTC, not in a run script:
      conda run -n mapping-sims genmap index -F data/s07-svs/ref-regions/mm39-19.fa -I data/s08-mappability/genmap/index
      ; then conda run -n mapping-sims genmap map -K 100 -E 2 -I data/s08-mappability/genmap/index
      -O data/s08-mappability/genmap/map/mm39-19-k100e2 -bg -T 4
      (writes map/mm39-19-k100e2.bedgraph: mappability of each 100-mer with <= 2 mismatches, chr19
      only). genmap index needs the -I directory not to exist; that session cleared a first
      attempt's index/ and map/ before this run. The chr19 FASTA used is s07's extract, which is
      byte-identical to data/s01-baseline-iterative/ref-regions/mm39-19.fa (cmp, 2026-10-26)."

notebooks:
  - path: analyses/s08-mappability/s08-results.rmd
    html: analyses/s08-mappability/s08-results.html
    render: >-
      conda run -n renv Rscript -e 'rmarkdown::render("analyses/s08-mappability/s08-results.rmd",
      knit_root_dir = getwd(), quiet = TRUE)'

outputs:
  - path: analyses/s08-mappability/results/s08-mappability-recovery.csv
    what: "s01 SNP divergence recall per caller x D (0.02, 0.06, 0.10) x iteration (1, 3) x reference
      mappability bin (GenMap K=100 E=2: unique / repetitive / highly repetitive)"
    script: analyses/s08-mappability/scripts/mappability_recovery.py
    command: >-
      conda run -n mapping-sims python analyses/s08-mappability/scripts/mappability_recovery.py
      --bedgraph data/s08-mappability/genmap/map/mm39-19-k100e2.bedgraph
      --data-dir data/s01-baseline-iterative --divs 0.02 0.06 0.10
      --callers gatk bcftools freebayes --iters 1 3
      --out analyses/s08-mappability/results/s08-mappability-recovery.csv
    inputs:
      - data/s08-mappability/genmap/map/mm39-19-k100e2.bedgraph
      - data/s01-baseline-iterative/sim/30X/19/{D}/0.005/42/mm39-truth.norm.vcf.gz
      - data/s01-baseline-iterative/iter/{caller}/30X/19/{D}/0.005/42/iter{K}/mm39_recovered.vcf.gz
    used_by:
      - analyses/s08-mappability/s08-results.rmd
      - analyses/synthesis/synthesis.rmd
      - analyses/synthesis/brief.rmd
    git: tracked
    note: "ad hoc command (2026-08-12 03:07 UTC), not in a run script; run after the last
      computational edit of mappability_recovery.py (03:07:00 UTC, the final mappability bins).
      Verified 2026-10-26: re-running this command into .llm-tmp/ reproduces the table byte for byte."
