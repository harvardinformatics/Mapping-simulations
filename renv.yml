# Conda environment for rendering the analysis notebooks (analyses/*/*.rmd) and running the R
# scripts in analyses/. Lists only the packages those load, pinned to the versions in the working
# environment on 2026-10-26 (that environment, also named renv, holds many unrelated packages, so it
# is not exported wholesale). ggalluvial, ggrepel and kableExtra were installed there with R's
# install.packages(); here they are requested from conda-forge at the same versions.
# Not yet tested by creating an environment from this file.
# Recreate with:  conda env create -f renv.yml
name: renv
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base=4.5.3
  - pandoc=3.8.2.1          # rmarkdown's document converter
  - r-rmarkdown=2.30
  - r-knitr=1.50
  - r-ggplot2=4.0.1
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-readr=2.1.6
  - r-tibble=3.3.0
  - r-scales=1.4.0
  - r-patchwork=1.3.2
  - r-ggalluvial=0.12.6     # alluvial (flow) plots
  - r-ggrepel=0.9.5         # non-overlapping point labels
  - r-kableextra=1.4.0      # formatted tables
